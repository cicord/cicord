# GoReleaser configuration of the `cicord` release binaries (https://cicord.dev/docs/project/releasing/).
#
# Used by .github/workflows/release.yml, which builds the web UIs first (pnpm build +
# scripts/sync-ui.sh, so the admin UI, the default portal and the portal kit are embedded),
# then runs `goreleaser release --skip=publish`: GoReleaser only builds, archives, checksums
# and SBOMs; the workflow attests the archives and creates the GitHub Release itself.
#
# Locally (after `make ui`):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,sbom
version: 2

project_name: cicord

builds:
  - id: cicord
    main: ./cmd/cicord
    binary: cicord
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Same ldflags as `make build`; the version is the tag without its leading "v".
    ldflags:
      - -s -w
      - -X github.com/cicord/cicord/internal/version.Version={{ .Version }}
      - -X github.com/cicord/cicord/internal/version.Commit={{ .ShortCommit }}
    # Reproducible: file times are the commit time.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: cicord
    ids: [cicord]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # cicord_0.1.0_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Reproducible: fixed owner and commit time on every entry.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive (syft, cataloguing the Go modules of the binary inside).
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

# Homebrew cask of the tap cicord/homebrew-tap (`brew install cicord/tap/cicord`): casks, not
# the deprecated `brews` formulas, are GoReleaser's way to ship prebuilt binaries, on macOS and
# Linux. skip_upload: GoReleaser only writes dist/homebrew/Casks/cicord.rb; the `homebrew` job
# of release.yml commits it to the tap once the GitHub Release exists (the URLs below point at
# its assets), with a token that only that job sees.
homebrew_casks:
  - name: cicord
    ids: [cicord]
    binaries: [cicord]
    description: "GitOps for Discord servers and bots, with sandboxed TypeScript plugins"
    homepage: https://cicord.dev/
    license: Apache-2.0
    repository:
      owner: cicord
      name: homebrew-tap
    directory: Casks
    skip_upload: true
    url:
      # The release is created by the workflow (release.disable below), so the URL is explicit.
      template: "https://github.com/cicord/cicord/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    # The binaries are not signed nor notarized: without this, macOS Gatekeeper refuses to run
    # a binary that Homebrew downloaded (quarantine attribute).
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/cicord"]
          end

# Release notes are generated by GitHub (`gh release create --generate-notes` in the workflow).
changelog:
  disable: true

release:
  disable: true

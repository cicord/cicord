# Publishes @codi/sdk, @codi/client, @codi/react and @codi/ui on npm (RELEASING.md).
#
# - Manual run (Actions → release-npm → Run workflow): a dry run by default (packs and
#   runs `npm publish --dry-run`); untick "dry-run" to publish.
# - Tag push `npm-v<version>` (e.g. npm-v0.1.0): publishes; the tag must equal the version
#   of the four package.json files.
#
# The packages are packed with `pnpm pack`, which rewrites the workspace:/catalog:
# specifiers to real versions, then the tarballs are published with npm provenance
# (signed build attestation, needs `id-token: write`). Versions already on npm are
# skipped, so a failed run can be re-run. Needs the repository secret NPM_TOKEN (an npm
# automation or granular token with publish rights on the @codi scope).
name: release-npm
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and run npm publish --dry-run only
        type: boolean
        default: true
  push:
    tags: ["npm-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r --filter "./packages/*" test

      - name: Versions
        id: version
        run: |
          set -euo pipefail
          v=""
          for p in sdk client react ui; do
            pv=$(node -p "require('./packages/$p/package.json').version")
            if [ -n "$v" ] && [ "$pv" != "$v" ]; then
              echo "::error::packages/$p is $pv, expected $v (the four packages are released together)"
              exit 1
            fi
            v=$pv
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "npm-v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the package version $v (expected npm-v$v)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p out
          for p in sdk client react ui; do
            (cd "packages/$p" && pnpm pack --pack-destination ../../out)
          done
          for f in out/*.tgz; do
            echo "── $f"
            tar -tzf "$f"
            # No workspace-only specifier may reach the registry.
            if tar -xzOf "$f" package/package.json | grep -E '"(workspace|catalog):'; then
              echo "::error::$f still has workspace:/catalog: specifiers"
              exit 1
            fi
          done

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Dependencies first: @codi/react depends on @codi/client.
          for p in sdk client react ui; do
            name="@codi/$p"
            tgz="out/codi-$p-$VERSION.tgz"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published: skipped"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$tgz" --access public --dry-run
            else
              npm publish "$tgz" --access public --provenance
            fi
          done

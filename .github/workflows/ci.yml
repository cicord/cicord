name: ci
# Runs on main, the 0.2 integration branch and every pull request. Actions are pinned to commit SHAs (tag in
# the comment); Dependabot proposes updates. The workflow only reads the repository.
on:
  push:
    branches: [main, feature/0.2.0]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history is scanned, not only the last commit
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the git history for secrets (.gitleaks.toml)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: Documentation in one place (sites/docs)
        run: scripts/check-docs.sh
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o bin/cicord ./cmd/cicord
      - run: ./bin/cicord validate examples/basic
      - run: ./bin/cicord validate examples/showcase

  # The state conformance suite (internal/state/statetest) and the CLI's PostgreSQL tests
  # against a real server; the job "go" runs them on SQLite only (they skip without
  # CICORD_TEST_POSTGRES_URL). Each test works in its own schema. The password is a
  # throwaway for this service container.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CICORD_TEST_POSTGRES_URL: postgres://postgres:ci-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/state/...
      - run: go test -race -run Postgres ./internal/cli/

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Built from source with the Go of go.mod, so it understands the language version.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      - name: govulncheck (known vulnerabilities reachable from the code)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (Go, React, TypeScript, JavaScript and security rules; .semgrepignore)
        run: |
          pipx run semgrep==1.186.0 scan --metrics=off --error \
            --config p/golang --config p/react --config p/typescript \
            --config p/javascript --config p/security-audit

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds every package and site, then format, lint, types and the example plugins.
      - run: pnpm run check
      # Package tests and the example plugins' unit tests.
      - run: pnpm test
      # Unused files, exports and dependencies (knip.json).
      - run: pnpm exec knip
      # Copy-pasted code above the threshold of .jscpd.json.
      - run: npx -y jscpd@5.4.3 --config .jscpd.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the container image (not pushed)
        run: DOCKER_BUILDKIT=1 docker build --build-arg VERSION=ci --build-arg COMMIT="${GITHUB_SHA::7}" -t cicord:ci .
      - name: Smoke test
        run: docker run --rm cicord:ci version

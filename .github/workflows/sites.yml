name: sites
# Builds the landing page (sites/landing, served at /) and the documentation
# (sites/docs, served at /docs/) into one static site and deploys it to GitHub Pages.
# Manual only: run it from Actions → sites → Run workflow once GitHub Pages is enabled
# (Settings → Pages → Source: GitHub Actions). The CI workflow already builds both sites
# on every push (pnpm -r build), so this one only publishes.
# Actions are pinned to commit SHAs (tag in the comment); only the deploy job can write.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public origin of the site (e.g. https://<owner>.github.io)"
        required: true
      base_path:
        description: "Path prefix the site is served under (e.g. /codi for https://<owner>.github.io/codi/; / for a custom domain)"
        required: true
        default: "/"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ inputs.site_url }}
      BASE_PATH: ${{ inputs.base_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C sites/landing build
      - run: pnpm -C sites/docs build
      - name: Assemble landing (/) and docs (/docs/)
        run: |
          mkdir -p _site/docs
          cp -R sites/landing/dist/. _site/
          cp -R sites/docs/dist/. _site/docs/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

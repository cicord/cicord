name: sites
# Builds the landing page (sites/landing, served at /) and the documentation
# (sites/docs, served at /docs/) into one static site and deploys it to GitHub Pages
# (Settings → Pages: Source GitHub Actions, custom domain cicord.dev). Publishes
# https://cicord.dev on every push to main that touches the sites or the packages they
# document, and on demand (Actions → sites → Run workflow). The CI workflow already builds
# both sites.
# Actions are pinned to commit SHAs (tag in the comment); only the deploy job can write.
on:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/sites.yml"
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public origin of the site (https://cicord.dev, or https://<owner>.github.io)"
        required: true
        default: "https://cicord.dev"
      base_path:
        description: "Path prefix the site is served under (e.g. /cicord for https://<owner>.github.io/cicord/; / for a custom domain)"
        required: true
        default: "/"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ inputs.site_url || 'https://cicord.dev' }}
      BASE_PATH: ${{ inputs.base_path || '/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C sites/landing build
      - run: pnpm -C sites/docs build
      - name: Assemble landing (/) and docs (/docs/)
        run: |
          mkdir -p _site/docs
          cp -R sites/landing/dist/. _site/
          cp -R sites/docs/dist/. _site/docs/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read # deploy-pages reads the artifact of the build job
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

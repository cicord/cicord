# yaml-language-server: $schema=../../spec/schemas/project.schema.json
# CODI showcase: a community server running the official plugin set (tickets, polls, levels,
# moderation). It is also the end-to-end fixture of internal/runtime/showcase_test.go.
apiVersion: codi.dev/v1alpha1
kind: Project
metadata:
  name: showcase
spec:
  engine: ">=0.1.0 <0.2.0"
  source:
    provider: github
    repo: https://github.com/example/codi-showcase
    branch: main
  runtime:
    url: https://codi.showcase.example
  writeBack:
    defaultMode: pullRequest
    policies:
      - paths: ["bots/**"]
        mode: commit

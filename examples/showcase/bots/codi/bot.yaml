# yaml-language-server: $schema=../../../../spec/schemas/bot.schema.json
apiVersion: codi.dev/v1alpha1
kind: Bot
metadata:
  name: codi
spec:
  applicationId: "887766554433221100"
  token:
    secretRef: DISCORD_TOKEN_CODI
  profile:
    username: CODI
  presence:
    status: online
    activity:
      type: watching
      name: the showcase
  servers: [showcase]
  plugins:
    - name: tickets
      source: ../../plugins/tickets
      grants:
        - discord.messages.send
        - discord.messages.read
        - discord.channels.read
        - discord.channels.manage
        - storage.kv
        - portal.routes
      config:
        panelChannel: help-desk
        category: support
        staffRoles: [support, mod]
        logChannel: ticket-log
        panel:
          title: Need help from the team?
          description: Click **Open a ticket** and tell us what is going on. Only you and the staff will see the conversation.
        maxOpenPerMember: 1

    - name: polls
      source: ../../plugins/polls
      grants:
        - discord.messages.send
        - discord.messages.read
        - discord.channels.read
        - discord.threads.manage
        - storage.kv
        - scheduler
        - events.publish
        - portal.routes
      config:
        defaultHours: 24
        managerRoles: [mod]

    - name: levels
      source: ../../plugins/levels
      grants:
        - discord.messages.send
        - discord.reactions.manage
        - discord.channels.read
        - discord.members.read
        - discord.roles.assign
        - storage.kv
        - scheduler
        - events.subscribe
        - portal.routes
        - portal.links
      config:
        cooldownSeconds: 60
        ignoredChannels: [staff-chat]
        announce:
          channel: level-ups
        rewards:
          - { level: 5, role: regular }
          - { level: 10, role: veteran }
          - { level: 25, role: legend, keep: true }
        recap:
          channel: level-ups

    - name: moderation
      source: ../../plugins/moderation
      grants:
        - discord.messages.send
        - discord.messages.manage
        - discord.channels.read
        - discord.members.read
        - discord.members.moderate
        - discord.dm.send
        - storage.kv
        - http.fetch
        - portal.routes
        - events.publish
      config:
        logChannel: mod-log
        warningDays: 30
        escalation:
          - { warnings: 3, action: timeout, durationMinutes: 60 }
          - { warnings: 5, action: kick }
        flood:
          exemptRoles: [mod, admin]

    - name: reaction-roles
      source: ../../plugins/reaction-roles
      grants:
        - discord.messages.send
        - discord.messages.read
        - discord.channels.read
        - discord.roles.assign
        - discord.members.read
        - discord.reactions.manage
        - storage.kv
      config:
        panels:
          - name: colors
            channel: roles
            title: Name color
            description: Pick the color of your name.
            mode: single
            options:
              - { role: red, emoji: "🔴" }
              - { role: blue, emoji: "🔵" }
              - { role: green, emoji: "🟢" }
          - name: pings
            channel: roles
            title: Notifications
            description: Choose what you want to be pinged for.
            style: select
            requiredRole: member
            options:
              - { role: events-ping, description: Game nights and community events }
              - { role: news-ping, description: Server news and updates }
          - name: games
            channel: roles
            title: What do you play?
            style: reactions
            options:
              - { role: minecraft, emoji: "⛏️" }
              - { role: chess, emoji: "♟️" }

    - name: audit-log
      source: ../../plugins/audit-log
      grants:
        - discord.messages.send
        - discord.channels.read
        - storage.kv
        - scheduler
        - events.subscribe
      config:
        channel: audit-log
        ignoredChannels: [staff-chat]
        events:
          polls: true

    - name: announcements
      source: ../../plugins/announcements
      grants:
        - discord.messages.send
        - discord.channels.read
        - storage.kv
        - scheduler
        - portal.routes
      config:
        timeZone: Europe/Paris
        channels: [announcements, general]
        announcements:
          - name: game-night
            channel: announcements
            cron: "0 20 * * 5"
            content: Game night starts now in the voice channels, see you there!
            embed:
              title: 🎲 Game night
              color: "#9b59b6"
            mentions:
              roles: [events-ping]
          - name: rules-reminder
            channel: general
            every: 2w
            start: "2026-01-05 10:00"
            content: A friendly reminder to read the rules and to pick your roles in the roles channel.

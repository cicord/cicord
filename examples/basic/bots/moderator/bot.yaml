# yaml-language-server: $schema=../../../../spec/schemas/bot.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Bot
metadata:
  name: moderator
spec:
  applicationId: "998877665544332211"
  token:
    secretRef: DISCORD_TOKEN_MODERATOR
  profile:
    username: Warden
  presence:
    status: online
    activity:
      type: watching
      name: the community
  servers: [my-community]
  plugins:
    - name: welcome
      source: ../../plugins/welcome
      grants:
        - discord.messages.send
        - discord.channels.read
        - discord.members.read
        - discord.roles.assign
        - discord.dm.send
        - portal.links
        - storage.kv
      config:
        channel: general
        message: "Welcome {member} to {server}! 👋"
        autoRole: member
        dmOnboarding: true
      overrides:
        my-community:
          config:
            message: "Hi {member}, welcome to {server}! Take a minute to read the rules."
    - name: onboarding
      source: ../../plugins/onboarding
      grants:
        - discord.roles.assign
        - storage.kv
        - portal.routes
        - portal.links
      config:
        title: Welcome to My Community!
        intro: Three quick questions to tailor the server to you. You can change your answers any time with /onboarding.
        steps:
          - id: games
            title: What do you play?
            description: You'll get the channels and pings of your games.
            multiple: true
            options:
              - role: minecraft
                emoji: "⛏️"
                description: Survival, creative and the community server
              - role: valorant
                emoji: "🎯"
                description: Ranked, customs and tournaments
              - role: lol
                label: League of Legends
                emoji: "🛡️"
                description: Flex, ARAM and Clash
          - id: platform
            title: Where do you mostly play?
            description: To find teammates on the same platform.
            required: true
            options:
              - role: pc
                emoji: "🖥️"
              - role: console
                emoji: "🎮"
              - role: mobile
                emoji: "📱"
          - id: notifications
            title: Should we ping you for events?
            description: Game nights, tournaments and community streams. No spam, promise.
            options:
              - role: ping-events
                label: Yes, ping me!
                emoji: "🔔"
                description: You'll be mentioned for every new event
        completedRole: member
        successMessage: "All set! Your roles are up to date, come say hi in #general."
        linkMessage: "Pick your roles on the community portal:"
        buttonLabel: Pick my roles

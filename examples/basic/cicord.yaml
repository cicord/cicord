# yaml-language-server: $schema=../../spec/schemas/project.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Project
metadata:
  name: ma-commu
spec:
  engine: ">=0.1.0 <0.2.0"
  source:
    provider: github
    repo: https://github.com/example/ma-commu-cicord
    branch: main
  runtime:
    url: https://cicord.ma-commu.example
  writeBack:
    defaultMode: pullRequest
    policies:
      # Plugin settings edited in the admin UI are committed directly…
      - paths: ["bots/**"]
        mode: commit
      # …while structural changes (roles, channels, permissions) need a review.
      - paths: ["servers/**"]
        mode: pullRequest

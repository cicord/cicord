# yaml-language-server: $schema=../../spec/schemas/project.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Project
metadata:
  name: my-community
spec:
  engine: ">=0.2.0-0 <0.3.0"
  source:
    provider: github
    repo: https://github.com/example/my-community-cicord
    branch: main
  runtime:
    url: https://cicord.my-community.example
  writeBack:
    defaultMode: pullRequest
    policies:
      # Plugin settings and Store installs made in the admin UI are committed directly…
      - paths: ["bots/**"]
        mode: commit
      # …while the server icon, banner and splash uploaded there open a pull request.
      # (The admin UI never edits roles, channels or permissions: they change through git.)
      - paths: ["servers/**"]
        mode: pullRequest

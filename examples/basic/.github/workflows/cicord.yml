# Generated by `cicord init`.
# CI validates and plans; the runtime (cicord serve) applies after merge (GitOps pull model).
#
# Repository settings:
#   secrets.CICORD_RUNTIME_TOKEN  the runtime's bearer token (CICORD_RUNTIME_TOKEN of cicord serve)
#   vars.CICORD_RUNTIME_URL       the runtime's https URL. It is set here, never read from
#                               cicord.yaml: a pull request must not choose where the token goes.
name: cicord
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      # The cicord release that generated this repository; bump it with the runtime.
      - run: go install github.com/cicord/cicord/cmd/cicord@v0.1.9
      - run: cicord validate

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - run: go install github.com/cicord/cicord/cmd/cicord@v0.1.9
      - run: cicord plan --remote --comment
        env:
          CICORD_RUNTIME_URL: ${{ vars.CICORD_RUNTIME_URL }}
          CICORD_RUNTIME_TOKEN: ${{ secrets.CICORD_RUNTIME_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

  status:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    # A newer merge supersedes the wait for an older one.
    concurrency:
      group: cicord-status
      cancel-in-progress: true
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - run: go install github.com/cicord/cicord/cmd/cicord@v0.1.9
      # The runtime pulls the merged commit (webhook or polling); wait for it to be applied.
      - run: cicord status --wait --revision ${{ github.sha }} --timeout 10m
        env:
          CICORD_RUNTIME_URL: ${{ vars.CICORD_RUNTIME_URL }}
          CICORD_RUNTIME_TOKEN: ${{ secrets.CICORD_RUNTIME_TOKEN }}

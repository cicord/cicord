# Generated by `codi init`.
# CI validates and plans; the runtime (codi serve) applies after merge (GitOps pull model).
name: codi
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codi-dev/setup-codi@v0
      - run: codi validate

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: codi-dev/setup-codi@v0
      - run: codi plan --remote --comment
        env:
          CODI_RUNTIME_TOKEN: ${{ secrets.CODI_RUNTIME_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

  status:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codi-dev/setup-codi@v0
      - run: codi status --wait --revision ${{ github.sha }}
        env:
          CODI_RUNTIME_TOKEN: ${{ secrets.CODI_RUNTIME_TOKEN }}

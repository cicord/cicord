# yaml-language-server: $schema=../../../spec/schemas/server.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Server
metadata:
  name: my-community
spec:
  discordId: "112233445566778899"
  profile:
    name: My Community
    verificationLevel: medium
    defaultNotifications: onlyMentions
    explicitContentFilter: allMembers
    preferredLocale: en-US
    systemChannel: general
    systemChannelFlags:
      welcomeMessages: true
      setupTips: false

  # Community (Server Settings → Enable Community): needed for the announcement channel,
  # the welcome screen and Discord's onboarding.
  community:
    enabled: true
    rulesChannel: rules
    updatesChannel: staff-chat

  afk:
    channel: voice
    timeout: 900

  syncPolicy:
    selfHeal: false
    prune: false
    deletionProtection: true

  everyone:
    permissions: [ViewChannel, ReadMessageHistory, AddReactions, UseApplicationCommands]

  roles:
    admin:
      name: Admin
      color: "#e74c3c"
      hoist: true
      permissions: [Administrator]
    moderator:
      name: Moderator
      color: "#e67e22"
      hoist: true
      permissions: [KickMembers, ModerateMembers, ManageMessages, ManageThreads]
    member:
      name: Member
      color: "#3498db"
      permissions: [SendMessages, EmbedLinks, AttachFiles, Connect, Speak]
    # Interest roles, self-assigned on the portal (plugin "onboarding").
    minecraft:
      name: Minecraft
      color: "#5b8731"
      mentionable: true
    valorant:
      name: Valorant
      color: "#ff4655"
      mentionable: true
    lol:
      name: League of Legends
      color: "#c89b3c"
      mentionable: true
    pc:
      name: PC
      color: "#95a5a6"
    console:
      name: Console
      color: "#9b59b6"
    mobile:
      name: Mobile
      color: "#1abc9c"
    ping-events:
      name: Event pings
      color: "#f1c40f"
      mentionable: true

  hierarchy: [admin, moderator, member, minecraft, valorant, lol, pc, console, mobile, ping-events]

  categories:
    info:
      name: Info
      position: 0
      overwrites:
        "@everyone":
          deny: [SendMessages]
    community:
      name: Community
      position: 1
    staff:
      name: Staff
      position: 2
      overwrites:
        "@everyone":
          deny: [ViewChannel]
        moderator:
          allow: [ViewChannel]

  channels:
    rules:
      name: rules
      type: text
      category: info
      position: 0
    announcements:
      name: announcements
      type: announcement
      category: info
      position: 1
    general:
      name: general
      type: text
      category: community
      topic: General chat
      position: 0
    voice:
      name: Voice
      type: voice
      category: community
      position: 1
      userLimit: 10
    staff-chat:
      name: staff
      type: text
      category: staff

  access:
    admins:
      roles: [admin]
    moderators:
      roles: [moderator]

  # Community portal (https://cicord.dev/docs/portal/custom-portal/): served at / by the runtime, no code needed.
  portal:
    theme:
      primary: "#5865f2"
      accent: "#eb459e"
      logo: ../assets/logo.svg
      mode: dark
    title: Welcome to My Community
    tagline: The community for game nights, tournaments and live streams.
    description: |
      Here we play **together**: Minecraft, Valorant, League of Legends and whatever comes next.

      ## What you'll find here
      - game nights every Friday
      - monthly tournaments with prizes
      - a moderation team that listens

      Read the [rules](https://my-community.example/rules) before posting.
    banner: ../assets/banner.jpg
    links:
      - label: Website
        url: https://my-community.example
        icon: website
      - label: YouTube channel
        url: https://www.youtube.com/@my-community
        icon: youtube
      - label: Twitch streams
        url: https://www.twitch.tv/my-community
        icon: twitch
      - label: Rules
        url: https://my-community.example/rules
        icon: rules
    pages:
      onboarding: true
      profile: true
    locale: en

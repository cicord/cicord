# yaml-language-server: $schema=../../../spec/schemas/server.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Server
metadata:
  name: ma-commu
spec:
  discordId: "112233445566778899"
  profile:
    name: Ma Commu
    verificationLevel: medium
    defaultNotifications: onlyMentions
    explicitContentFilter: allMembers
    preferredLocale: fr
    systemChannel: general
    systemChannelFlags:
      welcomeMessages: true
      setupTips: false

  # Community (Server Settings → Enable Community): needed for the announcement channel,
  # the welcome screen and Discord's onboarding.
  community:
    enabled: true
    rulesChannel: rules
    updatesChannel: staff-chat

  afk:
    channel: voice
    timeout: 900

  syncPolicy:
    selfHeal: false
    prune: false
    deletionProtection: true

  everyone:
    permissions: [ViewChannel, ReadMessageHistory, AddReactions, UseApplicationCommands]

  roles:
    admin:
      name: Admin
      color: "#e74c3c"
      hoist: true
      permissions: [Administrator]
    modo:
      name: Modo
      color: "#e67e22"
      hoist: true
      permissions: [KickMembers, ModerateMembers, ManageMessages, ManageThreads]
    member:
      name: Membre
      color: "#3498db"
      permissions: [SendMessages, EmbedLinks, AttachFiles, Connect, Speak]
    # Interest roles, self-assigned on the portal (plugin "onboarding").
    minecraft:
      name: Minecraft
      color: "#5b8731"
      mentionable: true
    valorant:
      name: Valorant
      color: "#ff4655"
      mentionable: true
    lol:
      name: League of Legends
      color: "#c89b3c"
      mentionable: true
    pc:
      name: PC
      color: "#95a5a6"
    console:
      name: Console
      color: "#9b59b6"
    mobile:
      name: Mobile
      color: "#1abc9c"
    ping-events:
      name: Notifs événements
      color: "#f1c40f"
      mentionable: true

  hierarchy: [admin, modo, member, minecraft, valorant, lol, pc, console, mobile, ping-events]

  categories:
    info:
      name: Infos
      position: 0
      overwrites:
        "@everyone":
          deny: [SendMessages]
    community:
      name: Communauté
      position: 1
    staff:
      name: Staff
      position: 2
      overwrites:
        "@everyone":
          deny: [ViewChannel]
        modo:
          allow: [ViewChannel]

  channels:
    rules:
      name: règlement
      type: text
      category: info
      position: 0
    announcements:
      name: annonces
      type: announcement
      category: info
      position: 1
    general:
      name: général
      type: text
      category: community
      topic: Discussions générales
      position: 0
    voice:
      name: Vocal
      type: voice
      category: community
      position: 1
      userLimit: 10
    staff-chat:
      name: staff
      type: text
      category: staff

  access:
    admins:
      roles: [admin]
    moderators:
      roles: [modo]

  # Community portal (docs/portal.md): served at / by the runtime, no code needed.
  portal:
    theme:
      primary: "#5865f2"
      accent: "#eb459e"
      logo: ../assets/logo.svg
      mode: dark
    title: Bienvenue sur Ma Commu
    tagline: La commu francophone des soirées jeux, tournois et lives.
    description: |
      Ici, on joue **ensemble** : Minecraft, Valorant, League of Legends et tout ce qui passe.

      ## Ce que tu trouveras ici
      - des soirées jeux chaque vendredi
      - des tournois mensuels avec des lots
      - une équipe de modération à l'écoute

      Lis le [règlement](https://ma-commu.example/regles) avant de poster.
    banner: ../assets/banner.jpg
    links:
      - label: Site web
        url: https://ma-commu.example
        icon: website
      - label: Chaîne YouTube
        url: https://www.youtube.com/@ma-commu
        icon: youtube
      - label: Lives Twitch
        url: https://www.twitch.tv/ma-commu
        icon: twitch
      - label: Règlement
        url: https://ma-commu.example/regles
        icon: rules
    pages:
      onboarding: true
      profile: true
    locale: fr
